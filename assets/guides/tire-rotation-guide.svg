<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1a1a1d"/>
      <stop offset="55%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4a4e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="rubberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="sillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3d"/>
      <stop offset="100%" stop-color="#222224"/>
    </linearGradient>
  </defs>

  <rect width="820" height="480" fill="url(#bgGlow2)"/>
  <g opacity="0.05">
    <line x1="-150" y1="0" x2="-260" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="-85" y1="0" x2="-195" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="-20" y1="0" x2="-130" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="45" y1="0" x2="-65" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="110" y1="0" x2="0" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="175" y1="0" x2="65" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="240" y1="0" x2="130" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="305" y1="0" x2="195" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="370" y1="0" x2="260" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="435" y1="0" x2="325" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="500" y1="0" x2="390" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="565" y1="0" x2="455" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="630" y1="0" x2="520" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="695" y1="0" x2="585" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="760" y1="0" x2="650" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="825" y1="0" x2="715" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="890" y1="0" x2="780" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="955" y1="0" x2="845" y2="480" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- vehicle pinch-weld / rocker sill, the lift point context -->
  <rect x="180" y="118" width="460" height="34" rx="4" fill="url(#sillGrad)" stroke="#111112" stroke-width="1.5"/>
  <rect x="180" y="146" width="460" height="6" fill="#0c0c0d"/>
  <text x="410" y="102" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="3" fill="#8d8d92" text-anchor="middle">LIFT POINT</text>
  <line x1="410" y1="107" x2="410" y2="116" stroke="#d81e2c" stroke-width="2"/>

  <!-- rubber lift puck, seated against the sill -->
  <g transform="translate(410,152)">
    <ellipse cx="0" cy="0" rx="58" ry="14" fill="#151517"/>
    <rect x="-58" y="0" width="116" height="46" fill="url(#rubberGrad)"/>
    <ellipse cx="0" cy="46" rx="58" ry="14" fill="#0a0a0b" stroke="#000" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="58" ry="14" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- orange locating ring, matching the real Tesla puck -->
    <rect x="-58" y="17" width="116" height="10" fill="#c1501f"/>
    <ellipse cx="0" cy="17" rx="58" ry="13.5" fill="none" stroke="#8f3a15" stroke-width="1"/>
    <!-- center guide post -->
    <ellipse cx="0" cy="-6" rx="18" ry="6" fill="#050506"/>
  </g>

  <!-- scissor jack beneath the puck -->
  <g transform="translate(410,198)">
    <!-- top saddle -->
    <rect x="-46" y="0" width="92" height="16" rx="3" fill="url(#metalGrad)" stroke="#0a0a0b" stroke-width="1.5"/>
    <!-- scissor arms -->
    <path d="M -40,14 L 40,150 M 40,14 L -40,150" stroke="url(#metalGrad)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="0" cy="82" r="9" fill="#2a2a2c" stroke="#0a0a0b" stroke-width="2"/>
    <!-- base -->
    <rect x="-70" y="150" width="140" height="18" rx="3" fill="url(#metalGrad)" stroke="#0a0a0b" stroke-width="1.5"/>
    <!-- lead screw -->
    <rect x="-4" y="16" width="8" height="66" fill="#3a3a3d"/>
    <line x1="-4" y1="20" x2="4" y2="20" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="27" x2="4" y2="27" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="34" x2="4" y2="34" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="41" x2="4" y2="41" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="48" x2="4" y2="48" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="55" x2="4" y2="55" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="62" x2="4" y2="62" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="69" x2="4" y2="69" stroke="#151517" stroke-width="1.5"/><line x1="-4" y1="76" x2="4" y2="76" stroke="#151517" stroke-width="1.5"/>
  </g>

  <!-- subtle upward lift arrows for motion cue -->
  <g opacity="0.85">
    <path d="M 292 260 l 0 -34 m -9,10 l 9,-10 l 9,10" stroke="#d81e2c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 528 260 l 0 -34 m -9,10 l 9,-10 l 9,10" stroke="#d81e2c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>