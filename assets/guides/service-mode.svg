<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1a1a1d"/>
      <stop offset="55%" stop-color="#0e0e10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
  </defs>

  <rect width="820" height="480" fill="url(#bgGlow4)"/>
  <g opacity="0.05">
    <line x1="-150" y1="0" x2="-260" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="-85" y1="0" x2="-195" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="-20" y1="0" x2="-130" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="45" y1="0" x2="-65" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="110" y1="0" x2="0" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="175" y1="0" x2="65" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="240" y1="0" x2="130" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="305" y1="0" x2="195" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="370" y1="0" x2="260" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="435" y1="0" x2="325" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="500" y1="0" x2="390" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="565" y1="0" x2="455" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="630" y1="0" x2="520" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="695" y1="0" x2="585" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="760" y1="0" x2="650" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="825" y1="0" x2="715" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="890" y1="0" x2="780" y2="480" stroke="#ffffff" stroke-width="1"/><line x1="955" y1="0" x2="845" y2="480" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- touchscreen bezel -->
  <rect x="150" y="95" width="520" height="310" rx="22" fill="url(#bezelGrad)" stroke="#0a0a0b" stroke-width="2"/>
  <!-- screen, red-framed to indicate Service Mode is active -->
  <rect x="172" y="117" width="476" height="266" rx="10" fill="url(#screenGrad)" stroke="#d81e2c" stroke-width="4"/>

  <!-- left rail: car icon tab, highlighted -->
  <rect x="186" y="131" width="46" height="238" rx="6" fill="#141416"/>
  <rect x="186" y="131" width="46" height="46" rx="6" fill="#d81e2c" opacity="0.9"/>
  <path d="M 197 150 l 6,-8 h 12 l 6,8 v 10 h -24 z" fill="#0c0c0e"/>
  <circle cx="203" cy="166" r="2.6" fill="#0c0c0e"/>
  <circle cx="219" cy="166" r="2.6" fill="#0c0c0e"/>

  <!-- simplified car silhouette, center-right of screen -->
  <g transform="translate(440,240)" opacity="0.92">
    <path d="M -110,10 q 6,-34 40,-40 h 70 q 34,4 42,34 l 14,4 q 8,3 8,12 v 14 q 0,6 -6,6 h -12 a16,16 0 1 1 -32,0 h -76 a16,16 0 1 1 -32,0 h -10 q -6,0 -6,-6 v -10 q 0,-8 6,-10 z" fill="#3a3a3d" stroke="#0a0a0b" stroke-width="2"/>
    <circle cx="-80" cy="24" r="14" fill="#151517" stroke="#0a0a0b" stroke-width="2"/>
    <circle cx="66" cy="24" r="14" fill="#151517" stroke="#0a0a0b" stroke-width="2"/>
    <path d="M -68,-20 q 8,-14 30,-16 h 26 q 20,2 28,18 z" fill="#232326"/>
  </g>

  <!-- SERVICE MODE badge, echoing the site's level-plate motif -->
  <g transform="translate(186,308)">
    <rect x="0" y="0" width="150" height="30" fill="#d81e2c"/>
    <text x="75" y="20" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" fill="#0a0a0b" text-anchor="middle" font-weight="700">SERVICE MODE</text>
  </g>
  <!-- wrench/service icon -->
  <g transform="translate(588,295) rotate(20)">
    <path d="M0,0 a10,10 0 1 1 -14,14 l-22,22 -7,-7 22,-22 a10,10 0 0 1 21,-7z" fill="#c9a24a" opacity="0.9"/>
  </g>

  <!-- pointing hand accent, echoing the source screenshot -->
  <g transform="translate(560,180)" opacity="0.85">
    <path d="M0,26 q-4,-18 6,-24 q6,-4 10,2 l2,-14 q1,-6 7,-5 q5,1 5,7 l-1,12 q4,-4 9,-1 q5,3 3,9 l-3,8 q9,0 9,9 q0,14 -14,18 q-18,5 -28,-3 q-6,-5 -5,-18z" fill="#e4c97a"/>
  </g>
</svg>