<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… | modMY</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a0a0b;
    color:#e6e6e8;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align:center;
    padding:24px;
  }
  .box{ max-width:420px; }
  h1{ font-size:20px; margin:0 0 12px; }
  p{ color:#9a9a9e; font-size:14px; line-height:1.5; margin:0 0 20px; }
  a{ color:#ff3346; text-decoration:none; font-size:14px; }
  a:hover{ text-decoration:underline; }
</style>
<script>
  (function () {
    var path = window.location.pathname;

    // Strip trailing slash for comparison
    var clean = path.replace(/\/$/, '');

    // If the path doesn't already end in .html and isn't a static asset
    // (image, css, js, xml, txt, etc.), assume it's a "clean" URL missing
    // its .html extension (e.g. /tesla-faqs -> /tesla-faqs.html) and send
    // the visitor to the real page instead of showing a dead end.
    var looksLikeAsset = /\.[a-zA-Z0-9]{2,5}$/.test(clean);

    if (clean && clean !== '' && clean !== '/' && !looksLikeAsset) {
      var target = clean + '.html';
      document.getElementById('target-link').href = target;
      document.getElementById('target-path').textContent = target;
      window.location.replace(target);
    } else {
      // Genuinely unknown page — send back home instead of guessing
      document.getElementById('target-link').href = '/';
      document.getElementById('target-path').textContent = 'the homepage';
    }
  })();
</script>
</head>
<body>
  <div class="box">
    <h1>Redirecting&hellip;</h1>
    <p>This page moved or the link was missing its file extension. Taking you to <span id="target-path">the right page</span> now.</p>
    <a id="target-link" href="/">Click here if you're not redirected automatically &rarr;</a>
  </div>
</body>
</html>
